  - "2-BACKEND/api"
  - "2-BACKEND/base-de-donnees"
  # 3-SECURITE : code de sécurité partagé et agents IA
  - "3-SECURITE/04-securite-applicative"
  - "3-SECURITE/05-agents-ia"
